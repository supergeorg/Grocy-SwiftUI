# Runs the unit tests and checks the formatting (swift-format) on every pull request and push to main.
# The integration and UI tests need a Grocy server (TestServer/) and aren't run here; without
# GROCY_TEST_SERVER_URL, the integration suites skip themselves.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: swift-format
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check formatting
        run: |
          xcrun swift-format --version
          xcrun swift-format format -i -r -p "Grocy Mobile" "Grocy Widget" "Grocy MobileTests" "Grocy MobileUITests"
          if ! git diff --exit-code -- '*.swift'; then
            echo "::error::Some Swift files aren't formatted. Run: xcrun swift-format format -i -r -p \"Grocy Mobile\" \"Grocy Widget\" \"Grocy MobileTests\" \"Grocy MobileUITests\""
            exit 1
          fi
      - name: Lint
        # Not strict: the remaining warnings in existing code can't be fixed automatically (see AGENTS.md).
        run: xcrun swift-format lint -r -p "Grocy Mobile" "Grocy Widget" "Grocy MobileTests" "Grocy MobileUITests"

  unit-tests:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick an iPhone simulator
        id: simulator
        # The app needs iOS 26.6, so pick an iPhone on the newest iOS runtime (the first one listed can be older).
        run: |
          xcodebuild -version
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return tuple(int(n) for n in re.findall(r"\d+", runtime.rsplit("iOS", 1)[-1]))
          runtimes = sorted((r for r in devices if ".SimRuntime.iOS-" in r), key=version, reverse=True)
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(runtime, file=sys.stderr)
                      print(device["udid"])
                      sys.exit(0)
          ')
          if [[ -z "$SIMULATOR_ID" ]]; then
            echo "::error::No iPhone simulator available."
            xcrun simctl list devices available
            exit 1
          fi
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
      - name: Run the unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "Grocy Mobile.xcodeproj" \
            -scheme "Grocy MobileTests" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -only-testing "Grocy MobileTests" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee xcodebuild.log | grep --line-buffered -E 'error:|✘|✔|Test Suite|Test Case|\*\* (BUILD|TEST)'
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            xcodebuild.log
          retention-days: 7
