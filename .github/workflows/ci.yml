# Runs the unit tests and checks the formatting (swift-format) on every pull request and push to main.
# The integration and UI tests need a Grocy server (TestServer/) and aren't run here; without
# GROCY_TEST_SERVER_URL, the integration suites skip themselves.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: swift-format
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        # "latest" includes betas and release candidates: the newest stable Xcode on the image can ship an
        # iOS runtime older than the deployment target.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Check formatting
        run: |
          xcrun swift-format --version
          xcrun swift-format format -i -r -p "Grocy Mobile" "Grocy Widget" "Grocy Watch Watch App" "Grocy MobileTests" "Grocy MobileUITests"
          if ! git diff --exit-code -- '*.swift'; then
            echo "::error::Some Swift files aren't formatted. Run: xcrun swift-format format -i -r -p \"Grocy Mobile\" \"Grocy Widget\" \"Grocy Watch Watch App\" \"Grocy MobileTests\" \"Grocy MobileUITests\""
            exit 1
          fi
      - name: Lint
        # Not strict: the remaining warnings in existing code can't be fixed automatically (see AGENTS.md).
        run: xcrun swift-format lint -r -p "Grocy Mobile" "Grocy Widget" "Grocy Watch Watch App" "Grocy MobileTests" "Grocy MobileUITests"

  unit-tests:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        # "latest" includes betas and release candidates: the newest stable Xcode on the image can ship an
        # iOS runtime older than the deployment target.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Pick an iPhone simulator
        id: simulator
        # Picks an iPhone on an iOS runtime that meets the deployment target, and downloads that runtime
        # if the runner image doesn't have it yet.
        timeout-minutes: 30
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          SIMULATOR_ID=$(python3 .github/scripts/pick-simulator.py)
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          # Boots while the app builds, instead of during the test step. That takes minutes on a runner.
          xcrun simctl boot "$SIMULATOR_ID" || true
      - name: Build the app and the unit tests
        # Built once, separately from the test run, so the log shows how long each part takes.
        # No index store: CI never uses it, and it slows down every compile.
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "Grocy Mobile.xcodeproj" \
            -scheme "Grocy MobileTests" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath DerivedData \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee xcodebuild-build.log | grep --line-buffered -E 'error:|\*\* (BUILD|TEST)|Build Timing Summary|^[A-Za-z]+ \([0-9]+ tasks?\) \|'
      - name: Run the unit tests
        # Without parallel testing, xcodebuild doesn't clone and boot extra simulators, which costs minutes on a
        # runner. The unit tests are fast, so one simulator is enough.
        run: |
          set -o pipefail
          xcrun simctl bootstatus "${{ steps.simulator.outputs.id }}" -b
          xcodebuild test-without-building \
            -project "Grocy Mobile.xcodeproj" \
            -scheme "Grocy MobileTests" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath DerivedData \
            -only-testing "Grocy MobileTests" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee xcodebuild.log | grep --line-buffered -E 'error:|✘|✔|Test Suite|Test Case|\*\* (BUILD|TEST)'
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            xcodebuild-build.log
            xcodebuild.log
          retention-days: 7
